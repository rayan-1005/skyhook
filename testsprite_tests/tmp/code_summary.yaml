version: "2"
type: backend
tech_stack:
  - Python 3
  - FastAPI
  - Uvicorn
  - Jinja2
  - Typer
  - python-multipart
  - Cryptography
features:
  - name: File Browser UI
    description: HTML file listing and directory browsing with optional basic auth.
    files:
      - src/skyhook/server.py
      - src/skyhook/templates/index.html
    endpoints:
      - method: GET
        path: /
        description: List root directory and render HTML.
        auth_required: false
        response_schema:
          "200": HTML
      - method: GET
        path: /browse/{path}
        description: Browse a specific directory and render HTML.
        auth_required: false
        response_schema:
          "200": HTML
    depends_on:
      - Path sanitization
      - Optional basic auth
  - name: File Download API
    description: Download a file from the served directory.
    files:
      - src/skyhook/server.py
      - src/skyhook/security.py
    endpoints:
      - method: GET
        path: /download/{path}
        description: Download a file by path.
        auth_required: false
        response_schema:
          "200": FileResponse
          "400": Not a file
          "403": Path traversal blocked
          "404": File not found
    depends_on:
      - Path sanitization
      - Optional basic auth
  - name: File Upload API
    description: Upload one or more files to a directory.
    files:
      - src/skyhook/server.py
      - src/skyhook/security.py
    endpoints:
      - method: POST
        path: /upload
        description: Upload files (multipart/form-data) with optional target path.
        auth_required: false
        request_schema:
          form:
            files: UploadFile[]
            path: string (optional)
        response_schema:
          "200": UploadResult
          "400": Invalid upload directory
          "403": Path traversal blocked
    depends_on:
      - Path sanitization
      - Optional basic auth
  - name: Health Check API
    description: Lightweight health status endpoint.
    files:
      - src/skyhook/server.py
    endpoints:
      - method: GET
        path: /health
        description: Return service status and version.
        auth_required: false
        response_schema:
          "200": {status: string, version: string}
    depends_on: []
known_limitations: []
